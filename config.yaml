# ========================================
# PROJECT CONFIGURATION
# ========================================
project:
  name: "Crypto Price Prediction"
  version: "1.0.0"
  description: "Système de prédiction de prix de cryptomonnaies avec ML/DL"
  author: "Votre Nom"

# ========================================
# DATA COLLECTION
# ========================================
data:
  # Cryptos à collecter
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
    - "ADA/USDT"
    - "SOL/USDT"
    - "XRP/USDT"
    - "DOT/USDT"
    - "DOGE/USDT"
    - "AVAX/USDT"
    - "MATIC/USDT"
  
  # Intervalle de temps
  interval: "1h"  # Options: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w
  
  # Période historique
  lookback_days: 730  # 2 ans
  
  # Mise à jour
  update_frequency: 3600  # secondes (1h)

# ========================================
# FEATURE ENGINEERING
# ========================================
features:
  # Indicateurs techniques
  technical_indicators:
    sma: [7, 25, 99]
    ema: [12, 26]
    rsi: [14]
    macd: [12, 26, 9]
    bollinger_bands: [20, 2]
    volume_sma: [20]
  
  # Features temporelles
  temporal_features:
    - hour
    - day_of_week
    - day_of_month
    - month
    - is_weekend
  
  # Lag features
  lag_periods: [1, 2, 3, 6, 12, 24]

# ========================================
# MODEL TRAINING
# ========================================
models:
  # Split des données
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  
  # Random state pour reproductibilité
  random_state: 42
  
  # Modèles à entraîner
  enabled_models:
    - linear_regression
    - random_forest
    - xgboost
    - lstm
  
  # Hyperparamètres par défaut
  hyperparameters:
    random_forest:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 2
    
    xgboost:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 6
    
    lstm:
      units: [128, 64]
      dropout: 0.2
      epochs: 100
      batch_size: 32

# ========================================
# PREDICTION
# ========================================
prediction:
  # Horizons de prédiction (en heures)
  horizons: [1, 6, 24, 168]  # 1h, 6h, 1j, 1 semaine
  
  # Mise à jour des prédictions
  update_frequency: 300  # secondes (5 min)
  
  # Confiance
  confidence_interval: 0.95

# ========================================
# DASHBOARD
# ========================================
dashboard:
  title: "Crypto Price Prediction Dashboard"
  port: 8501
  theme: "dark"
  refresh_rate: 30  # secondes

# ========================================
# API
# ========================================
api:
  title: "Crypto Prediction API"
  version: "1.0.0"
  rate_limit: "100/hour"
  
  endpoints:
    - /predict
    - /historical
    - /models/performance
    - /health

# ========================================
# MONITORING
# ========================================
monitoring:
  metrics:
    - rmse
    - mae
    - mape
    - r2_score
  
  alerts:
    performance_threshold: 0.1  # Alert si MAPE > 10%
    latency_threshold: 1000  # ms
