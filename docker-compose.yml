version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: crypto_timescaledb
    restart: always
    ports:
      - "5433:5433"
    environment:
      POSTGRES_DB: crypto_prediction
      POSTGRES_USER: taki
      POSTGRES_PASSWORD: takiensah00
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taki -d crypto_prediction"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  timescaledb_data:
  redis_data: